<!DOCTYPE html>
<html>

<head>
  <title>Restart - %devname%</title>
  <link rel='stylesheet' type='text/css' href='/styles.css'>
  <link rel='stylesheet' type='text/css' href='/common.css'>
  <meta http-equiv='content-type' content='text/html; charset=UTF-8'>
  <meta name=viewport content='width=device-width, initial-scale=1'>
  <meta name='csrf-token' content='%csrfToken%'>
  <script src='/common.js' type='text/javascript'></script>
</head>

<body class="restart-page">
  %header%
  
  <div class="hidden" id="loader" style="display:none;"></div>
  <div id="myDiv" class="animate-bottom restart-panel" style="display:block;">
    <div class="page-hero">
      <h3>Restart Device</h3>
      <p class="muted-text">Use this only when you want to reboot the ESP immediately. After a successful restart, the page returns to the overview automatically.</p>
    </div>
    <div class="notice notice-info">
      Sensor acquisition, Wi-Fi and the web interface will be briefly interrupted during the reboot.
    </div>
    <div class="button-row">
      <button id="restartDeviceButton">Restart Device</button>
      <button id="restartBackButton" class="button-secondary">Back to Overview</button>
    </div>
  </div>
</body>

<script src='/restart.js' type='text/javascript'></script>

</html>
