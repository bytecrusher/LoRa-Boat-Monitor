<!DOCTYPE html>
<html>

<head>
  <title>Restart - %devname%</title>
  <link rel='stylesheet' type='text/css' href='/styles.css'>
  <link rel='stylesheet' type='text/css' href='/common.css'>
  <meta http-equiv='content-type' content='text/html; charset=UTF-8'>
  <meta name=viewport content='width=device-width, initial-scale=1'>
</head>

<body class="restart-page">
  %header%
  
  <div class="hidden" id="loader"></div>
  <div id="myDiv" class="animate-bottom restart-panel">
    <h3>Restart</h3>
    The device returns to the overview page automatically after the restart.
    <br><br>
    <button onclick="httpGetAsync('?restart=1')">Restart Device</button>
    <br>
    <hr>
    <br>
    <button onclick="window.open('/', '_self');">Back to Overview</button>
    <br>
  </div>
</body>

<script>
  theUrl = window.location.origin;
  let myInterval = null;

  function setRestartState(isRestarting) {
    document.getElementById("loader").classList.toggle("hidden", !isRestarting);
    document.getElementById("myDiv").classList.toggle("hidden", isRestarting);
  }

  function httpGetAsync(param) {
    const response = confirm("Are you sure you want to restart the device?");
    if (response) {
      var request = new XMLHttpRequest();
      request.open("GET",theUrl + param);
      //request.setRequestHeader("X-Test","test1");
      //request.setRequestHeader("X-Test","test2");
      request.addEventListener('load', function(event) {
        if (request.status >= 200 && request.status < 300) {
            //console.log(request.responseText);
        } else {
            console.warn(request.statusText, request.responseText);
        }
      });
      request.send();
      setRestartState(true);
      myInterval = setInterval(function () { 
        if (document.getElementById("myping").classList.contains("led-green")) {
          setRestartState(false);
          clearInterval(myInterval);
          window.location.replace("/");
        }
      }, 900);
    }
  }
</script>

</html>
