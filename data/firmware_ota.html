<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>OTA Update</title>
    <link rel='stylesheet' type='text/css' href='/firmware_ota.css'>
</head>
<body>
<div class="tile-container">
    <h1>OTA Update</h1>
</div>

<div class="container">
    <form enctype="multipart/form-data" class="form-container" id="upload_form" method="post">
        <div id="switch-container">
            <button class="button-o left selected" id="firmware-button" type="button">Firmware</button>
            <button class="button-o right" id="filesystem-button" type="button">File System</button>
        </div>

        <input accept='.bin,.bin.gz' class="input-file" id="file1" name='firmware' type="file"><br>
        <div class="progress">
            <span class="progress-bar" id="progressBar"></span>
        </div>
        <div class="additional-info">
            <h3 id="status">Firmware upload</h3>
            <p id="loaded_n_total"></p>
        </div>
        <hr/>
        <button id="button-send" class="button-send" type="submit" disabled>Start Update</button>
    </form>
</div>

<script src='/firmware_ota.js' type='text/javascript'></script>
</body>
</html>
