<!DOCTYPE html>
<html>

<head>
    <title>Password - %devname%</title>
    <link rel='stylesheet' type='text/css' href='/styles.css'>
    <link rel='stylesheet' type='text/css' href='/common.css'>
    <meta http-equiv='content-type' content='text/html; charset=UTF-8'>
    <meta name=viewport content='width=device-width, initial-scale=1'>
    <script src='MD5.js' type='text/javascript'></script>
    <style>
        .password-page .password-form {
            margin-bottom: 20px;
        }

        .password-page .password-form-secondary {
            margin-top: 20px;
        }

        .password-page .password-input {
            margin-bottom: 20px;
        }
    </style>
</head>

<body class="password-page">
    %header%
    <h3>Password Required</h3>
    <form id='pwdForm' class="password-form" action='%action%' method='get'>
        <input class="password-input" size=20 type='text' name='password' id='password' onkeypress='return event.keyCode != 13;' autofocus>
        <br>
        <button type='button' onClick='proc()' id='myBtn'>Continue</button>
    </form>
    <hr>
    <form id='pwdForm2' class="password-form-secondary" action='/' method='get'>
        <button type='submit'>Back to Overview</button>
    </form>
    <script>
        var input = document.getElementById("password");
        input.addEventListener("keypress", function(event) {
        if (event.key === "Enter") {
            event.preventDefault();
            document.getElementById("myBtn").click();
        }
        });
    </script>
</body>

</html>
