<!DOCTYPE html>
<html>

<head>
  <title>Main - %devname%</title>
  <link rel='stylesheet' type='text/css' href='/styles.css'>
  <link rel='stylesheet' type='text/css' href='/common.css'>
  <meta http-equiv='content-type' content='text/html; charset=UTF-8'>
  <meta name=viewport content='width=device-width, initial-scale=1'>
</head>

<body>
  %header%
  <h3><data class="blink" id='info'></data></h3>

  <div class="page-content">
    <div class="action-grid">
      <form action='sensorv.html'><button type='submit' id='sensorv'>Sensor Values</button></form>
      <form action='firmware.html'><button type='submit' id='firmware'>Firmware & Web Update</button></form>
      <form action='lora.html'><button type='submit' id='lora'>LoRa Status</button></form>
      <form action='restart.html'><button type='submit' id='restart'>Restart Device</button></form>
      <form action='devinfo.html'><button type='submit' id='devinfo'>Device Info</button></form>
      <form action='filesystem.html'><button type='submit' id='filesystem'>File Manager</button></form>
      <form action='settings.html'><button type='submit' id='settings'>Device Settings</button></form>
      <form action='https://norbert-walter.github.io/LoRa-Boat-Monitor/public/index_V1.01.html'><button type='submit' id='help'>Documentation</button></form>
      <button class="action-button" id='webserialRow' type="button" onclick="window.open('/webserial','_blank')">Browser Serial Console</button>
    </div>
  </div>

  <br>
  <hr>
  <script src='/common.js' type='text/javascript'></script>
  <script src='/index.js' type='text/javascript'></script>
</body>
</html>
