name: CI

on: [push]

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-20.04]
    
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
        with: 
          submodules: "recursive"
      - name: Install deps
        run: |
          #apt-get install -y python3-pip
          python3 -m pip install --upgrade pip
          pip install -U platformio
      - name: Validate project contracts
        run: |
          python3 scripts/validate_project.py
          for file in data/*.js src/Payload_Formats_*.js; do node --check "$file"; done
      - name: Build
        run: |
          pio run
          cp ./.pio/build/heltec_wifi_lora_32_V2/firmware.bin ./docs/firmware.bmb
